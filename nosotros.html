// ─── ABOUT THE FIRM ──────────────────────────────────────────
function FounderBio({ lang }) {
  const t = lang === 'en' ? {
    eyebrow: 'About the firm',
    h: 'A specialized firm: senior leadership at the front, expert network in the back.',
    p1: 'OTS S.A.S is a Colombian specialized consultancy in territorial planning, environmental management and public-investment formulation. Our model articulates direct partner-led delivery with a curated network of associated specialists — engaged by project, sized to scope.',
    p2: 'This structure is deliberate. It means every engagement is led personally by senior leadership — from kickoff through final delivery — while bringing in the right depth of expertise (environmental engineering, GIS, risk modeling, prior-consultation specialists, legal support) precisely when the project requires it.',
    p3: 'The firm rests on 16+ years of accumulated consulting and advisory practice in public, private and multilateral entities — across territorial planning, environmental assessment and public investment in Colombia.',
    cred: 'Founding partner · academic background',
    creds: [
      { l: 'Universidad de los Andes', d: 'PhD candidate · Economics' },
      { l: 'Universidad de los Andes', d: 'M.Sc. Economics' },
      { l: 'Universidad Autónoma de Manizales', d: 'M.Sc. Regional Development & Territorial Planning' },
      { l: 'Universidad del Tolima', d: 'B.A. Economics' }
    ],
    callout: '16+ years of consulting and advisory experience backing every project the firm delivers.'
  } : {
    eyebrow: 'Sobre la firma',
    h: 'Una firma especializada: dirección senior al frente, red de aliados al respaldo.',
    p1: 'OTS S.A.S es una firma colombiana especializada en ordenamiento territorial, gestión ambiental y formulación de inversión pública. Nuestro modelo articula la dirección directa del socio fundador con una red curada de profesionales aliados — vinculados por proyecto, dimensionados al alcance.',

    p3: 'La firma se respalda en más de 16 años de práctica consultiva y de asesoría acumulada en entidades públicas, privadas y multilaterales — en ordenamiento territorial, evaluación ambiental e inversión pública en Colombia.',

    creds: [
      { l: 'Universidad de los Andes', d: 'Candidato a Doctor · Economía' },
      { l: 'Universidad de los Andes', d: 'Magíster en Economía' },
      { l: 'Universidad Autónoma de Manizales', d: 'Magíster · Desarrollo Regional y Planificación del Territorio' },
      { l: 'Universidad del Tolima', d: 'Economista' }
    ],
    callout: '16+ años de experiencia consultiva y de asesoría respaldan cada proyecto que entrega la firma.'
  };
  return (
    <section style={{ background: '#fff', padding: '110px 40px', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div style={{ fontSize: 11, letterSpacing: 3, textTransform: 'uppercase', color: FUSION_ACCENT,
          fontFamily: '"IBM Plex Mono", monospace', marginBottom: 18 }}>◦ {t.eyebrow}</div>
        <h2 style={{ fontSize: 44, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -1.4, margin: 0, lineHeight: 1.12, maxWidth: 880 }}>{t.h}</h2>

        <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 80, marginTop: 60, alignItems: 'start' }}>
          <div>
            <p style={{ fontSize: 17, color: '#2C4A54', lineHeight: 1.65, margin: 0 }}>{t.p1}</p>
            <p style={{ fontSize: 17, color: '#2C4A54', lineHeight: 1.65, marginTop: 20 }}>{t.p2}</p>
            <p style={{ fontSize: 17, color: '#2C4A54', lineHeight: 1.65, marginTop: 20 }}>{t.p3}</p>
            <div style={{ marginTop: 36, padding: '22px 24px', background: 'rgba(196,122,61,.08)',
              borderLeft: `3px solid ${FUSION_ACCENT}` }}>
              <div style={{ fontSize: 16, color: FUSION_PRIMARY, lineHeight: 1.55, fontStyle: 'italic', fontWeight: 500 }}>
                {t.callout}
              </div>
            </div>
          </div>
          <div style={{ background: FUSION_BG, padding: '32px 28px' }}>
            <div style={{ fontSize: 10, color: FUSION_ACCENT, fontFamily: '"IBM Plex Mono", monospace',
              letterSpacing: 2, textTransform: 'uppercase', marginBottom: 22 }}>
              ◦ {t.cred}
            </div>
            <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: 0 }}>
              {t.creds.map((c, i) => (
                <li key={i} style={{ paddingTop: 18, paddingBottom: 18, borderTop: i === 0 ? 'none' : '1px solid rgba(11,61,79,.12)' }}>
                  <div style={{ fontSize: 15, fontWeight: 700, color: FUSION_PRIMARY, letterSpacing: -0.2 }}>{c.l}</div>
                  <div style={{ fontSize: 13, color: '#2C4A54', opacity: 0.78, marginTop: 4 }}>{c.d}</div>
                </li>
              ))}
            </ul>
          </div>
        </div>
      </div>
    </section>);
}

// ─── PRACTICE AREAS ─────────────────────────────────────────
function Capacidades({ lang }) {
  const t = lang === 'en' ? {
    eyebrow: 'Practice areas', h: 'Six lines of capability',
    sub: 'Partner-led delivery in territorial planning, public investment and economics — backed by a curated network of specialized associates for environmental, risk-modeling and field-engineering scopes.',

      { area: 'Territorial planning', detail: 'POT, PBOT, EOT, urban-rural articulation', core: true },
      { area: 'Public investment formulation', detail: 'MGA, SGR, DNP project banks, ex-post evaluation', core: true },
      { area: 'Economics & public policy', detail: 'Quantitative analysis, applied econometrics, evaluation', core: true },
      { area: 'Environmental assessment', detail: 'EIA, PMA, environmental licensing', core: false },
      { area: 'Risk management', detail: 'PMGRD, hazard & vulnerability analysis', core: false },
      { area: 'Citizen participation', detail: 'Methodology design, prior consultation', core: true }

    coreLabel: 'Partner-led',
    assocLabel: 'Specialized network'
  } : {
    eyebrow: 'Áreas de práctica', h: 'Seis líneas de capacidad',
    sub: 'Dirección del socio fundador en ordenamiento territorial, inversión pública y economía — respaldada por una red curada de aliados especializados para alcances ambientales, modelamiento de riesgo e ingeniería de campo.',
    items: [
      { area: 'Ordenamiento territorial', detail: 'POT, PBOT, EOT, articulación urbano-rural', core: true },
      { area: 'Formulación de inversión pública', detail: 'MGA, SGR, bancos de proyectos DNP, evaluación ex-post', core: true },
      { area: 'Economía y política pública', detail: 'Análisis cuantitativo, econometría aplicada, evaluación', core: true },
      { area: 'Evaluación ambiental', detail: 'EIA, PMA, licenciamiento ambiental', core: false },
      { area: 'Gestión del riesgo', detail: 'PMGRD, análisis de amenaza y vulnerabilidad', core: false },
      { area: 'Participación ciudadana', detail: 'Diseño metodológico, consulta previa', core: true }
    ],
    coreLabel: 'Dirección del socio',
    assocLabel: 'Red de aliados'
  };
  return (
    <section style={{ background: FUSION_DARK, color: FUSION_INK_LIGHT, padding: '110px 40px', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.4fr', gap: 80, alignItems: 'end', marginBottom: 60 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: 3, textTransform: 'uppercase', color: FUSION_ACCENT,
              fontFamily: '"IBM Plex Mono", monospace', marginBottom: 18 }}>◦ {t.eyebrow}</div>
            <h2 style={{ fontSize: 48, fontWeight: 800, letterSpacing: -1.4, margin: 0, lineHeight: 1.08 }}>{t.h}</h2>
          </div>
          <p style={{ fontSize: 17, color: 'rgba(232,230,220,.72)', lineHeight: 1.55, margin: 0, maxWidth: 540 }}>{t.sub}</p>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: 'rgba(232,230,220,.1)' }}>
          {t.items.map((x, i) => (
            <div key={i} style={{ background: FUSION_DARK, padding: '32px 28px', position: 'relative' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14, gap: 10 }}>
                <div style={{ fontSize: 11, color: FUSION_ACCENT, fontFamily: '"IBM Plex Mono", monospace', letterSpacing: 1.5 }}>
                  0{i + 1}
                </div>
                <div style={{
                  fontSize: 8.5, fontFamily: '"IBM Plex Mono", monospace',
                  letterSpacing: 1, textTransform: 'uppercase',
                  padding: '3px 8px',
                  background: x.core ? 'rgba(196,122,61,.18)' : 'rgba(232,230,220,.06)',
                  color: x.core ? FUSION_ACCENT : 'rgba(232,230,220,.55)',
                  border: x.core ? `1px solid ${FUSION_ACCENT}` : '1px solid rgba(232,230,220,.18)'
                }}>
                  {x.core ? t.coreLabel : t.assocLabel}
                </div>
              </div>
              <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: -0.2, marginBottom: 8 }}>{x.area}</div>
              <div style={{ fontSize: 14, color: 'rgba(232,230,220,.65)', lineHeight: 1.5 }}>{x.detail}</div>
            </div>
          ))}
        </div>
      </div>
    </section>);
}

// ─── PRINCIPLES ─────────────────────────────────────────────
function Principios({ lang }) {
  const t = lang === 'en' ?
    { eyebrow: 'Principles', h: 'How the firm holds itself accountable' } :
    { eyebrow: 'Principios', h: 'Cómo se exige la firma a sí misma' };
  return (
    <section style={{ background: FUSION_BG, padding: '110px 40px', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ fontSize: 11, letterSpacing: 3, textTransform: 'uppercase', color: FUSION_ACCENT,
          fontFamily: '"IBM Plex Mono", monospace', marginBottom: 18 }}>◦ {t.eyebrow}</div>
        <h2 style={{ fontSize: 52, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -1.5, margin: 0, lineHeight: 1.05, marginBottom: 60 }}>{t.h}</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 1, background: 'rgba(11,61,79,.12)', border: '1px solid rgba(11,61,79,.12)' }}>
          {PRINCIPIOS.map((p, i) => (
            <div key={i} style={{ background: FUSION_BG, padding: '40px 36px' }}>
              <div style={{ fontSize: 12, color: FUSION_ACCENT, fontFamily: '"IBM Plex Mono", monospace', letterSpacing: 1.5, marginBottom: 14 }}>
                0{i + 1}
              </div>
              <div style={{ fontSize: 26, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -0.6, lineHeight: 1.2 }}>
                {lang === 'en' ? p.t_en : p.t}
              </div>
              <div style={{ fontSize: 15, color: '#2C4A54', opacity: 0.78, lineHeight: 1.6, marginTop: 14, maxWidth: 460 }}>
                {lang === 'en' ? p.d_en : p.d}
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>);
}

// ─── NEXT-PAGE STRIP ────────────────────────────────────────
function NextStrip({ lang }) {
  const t = lang === 'en' ?
    { l: 'Next', a: 'Contact', b: 'Build the project together.', cta: 'Continue →' } :
    { l: 'Sigue', a: 'Contacto', b: 'Construyamos el proyecto juntos.', cta: 'Continuar →' };
  return (
    <a href="contacto.html" style={{
      display: 'block', background: FUSION_BG, padding: '60px 40px', textDecoration: 'none', color: 'inherit',
      borderTop: '1px solid rgba(11,61,79,.1)', fontFamily: '"Archivo", sans-serif'
    }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 2fr 1fr',
        gap: 40, alignItems: 'center' }}>
        <div style={{ fontSize: 10, fontFamily: '"IBM Plex Mono", monospace', letterSpacing: 2, color: FUSION_ACCENT, textTransform: 'uppercase' }}>
          {t.l} · 04
        </div>
        <div>
          <div style={{ fontSize: 32, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -0.8 }}>{t.a}</div>
          <div style={{ fontSize: 15, color: '#2C4A54', opacity: 0.78, marginTop: 6 }}>{t.b}</div>
        </div>
        <div style={{ justifySelf: 'end', fontSize: 14, fontWeight: 600, color: FUSION_ACCENT }}>{t.cta}</div>
      </div>
    </a>);
}

  const [lang, setLang] = useLang();
  const t = lang === 'en' ? {
    eyebrow: 'About', title: 'A specialized firm.', titleAccent: 'Senior at the helm.',
    sub: 'OTS S.A.S articulates partner-led delivery with a curated network of specialized professionals — a consulting model built for demanding territorial engagements.',
    bc: [{ href: 'index.html', label: 'Home' }, { label: 'About' }]
  } : {
    eyebrow: 'Nosotros', title: 'Una firma especializada.', titleAccent: 'Dirección senior al frente.',
    sub: 'OTS S.A.S articula la dirección directa del socio fundador con una red curada de profesionales aliados — un modelo de consultoría diseñado para proyectos territoriales exigentes.',
    bc: [{ href: 'index.html', label: 'Inicio' }, { label: 'Nosotros' }]
  };
  return (
    <React.Fragment>
      <Header lang={lang} setLang={setLang} current="nosotros" />
      <PageHero eyebrow={t.eyebrow} kicker="03 / 04" title={t.title} titleAccent={t.titleAccent} sub={t.sub} />
      <Breadcrumb items={t.bc} />
      <FounderBio lang={lang} />
      <Capacidades lang={lang} />
      <Principios lang={lang} />
      <NextStrip lang={lang} />
      <Footer lang={lang} />
    </React.Fragment>);
}
