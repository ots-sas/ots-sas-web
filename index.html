<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTS · Ordenamiento Territorial Sostenible</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0B242C; }
  body { font-family: "Archivo", sans-serif; color: #0B3D4F; -webkit-font-smoothing: antialiased; }
  a:hover { opacity: 0.85; }
  ::selection { background: #C47A3D; color: #fff; }
  html { scroll-behavior: smooth; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="shared.jsx"></script>

<script type="text/babel" data-presets="react">

// ─── HOME HERO ─────────────────────────────────────────────
function HomeHero({ lang }) {
  const t = lang === 'en' ? {
    eyebrow: 'Environmental & territorial consulting · Colombia',
    h1a: 'We plan the', h1b: 'territory', h1c: 'we want to inhabit',
    sub: 'We formulate, execute and evaluate investment projects in territorial planning and environmental management for local governments, ministries and multilateral agencies.',
    cta1: 'Explore services', cta2: 'See our work', since: 'Working since March 2024'
  } : {
    eyebrow: 'Consultoría ambiental y territorial · Colombia',
    h1a: 'Planificamos el', h1b: 'territorio', h1c: 'que queremos habitar',
    sub: 'Formulamos, ejecutamos y evaluamos proyectos de inversión en ordenamiento territorial y gestión ambiental para entes territoriales, ministerios y agencias multilaterales.',
    cta1: 'Ver servicios', cta2: 'Trayectoria', since: 'Operando desde marzo 2024'
  };
  return (
    <section style={{ background: FUSION_DARK, color: FUSION_INK_LIGHT, position: 'relative', overflow: 'hidden',
      padding: '110px 40px 130px', fontFamily: '"Archivo", sans-serif' }}>
      <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.14, pointerEvents: 'none' }} viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
        <g stroke={FUSION_INK_LIGHT} strokeWidth="0.7" fill="none">
          <path d="M -100 400 Q 200 200, 600 300 Q 1000 400, 1400 250" />
          <path d="M -100 460 Q 200 280, 600 360 Q 1000 440, 1400 320" />
          <path d="M -100 520 Q 200 360, 600 420 Q 1000 480, 1400 390" />
          <path d="M -100 580 Q 200 440, 600 480 Q 1000 520, 1400 460" />
          <path d="M -100 640 Q 200 520, 600 540 Q 1000 560, 1400 530" />
          <path d="M -100 340 Q 200 120, 600 240 Q 1000 360, 1400 180" />
          <path d="M -100 280 Q 200 40, 600 180 Q 1000 320, 1400 110" />
        </g>
      </svg>
      <div style={{ maxWidth: 1200, margin: '0 auto', position: 'relative' }}>
        <div style={{ fontSize: 11, letterSpacing: 3, textTransform: 'uppercase', color: FUSION_ACCENT,
          fontFamily: '"IBM Plex Mono", monospace', marginBottom: 28 }}>
          {t.eyebrow}
        </div>
        <h1 style={{ fontSize: 72, fontWeight: 800, lineHeight: 1.02, letterSpacing: -2, margin: 0, maxWidth: 980 }}>
          {t.h1a} <span style={{ fontStyle: 'italic', fontWeight: 500, color: FUSION_ACCENT }}>{t.h1b}</span><br />
          {t.h1c}
        </h1>
        <p style={{ fontSize: 18, lineHeight: 1.55, color: 'rgba(232,230,220,.72)', marginTop: 32, maxWidth: 680 }}>
          {t.sub}
        </p>
        <div style={{ marginTop: 42, display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
          <a href="servicios.html" style={{ background: FUSION_ACCENT, color: '#fff', padding: '14px 22px',
            fontSize: 14, fontWeight: 600, textDecoration: 'none', borderRadius: 2 }}>
            {t.cta1} →
          </a>
          <a href="trayectoria.html" style={{ border: '1px solid rgba(232,230,220,.25)', color: FUSION_INK_LIGHT,
            padding: '13px 22px', fontSize: 14, textDecoration: 'none', borderRadius: 2 }}>
            {t.cta2}
          </a>
          <div style={{ marginLeft: 'auto', fontSize: 10, fontFamily: '"IBM Plex Mono", monospace',
            letterSpacing: 1.5, color: 'rgba(232,230,220,.45)' }}>
            ◦ {t.since}
          </div>
        </div>
      </div>
    </section>);
}

// ─── MARQUEE ─────────────────────────────────────────────────
function Marquee({ lang }) {
  const label = lang === 'en' ? 'Proposals submitted to / active engagements with' : 'Propuestas y gestiones activas con';
  const items = ['Ministerio de Ambiente y Desarrollo Sostenible', 'Alcaldía de Mariquita', 'Alcaldía de Prado',
    'Alcaldía de Campoalegre', 'Alcaldía de Paicol', 'Alcaldía de San Agustín'];
  return (
    <section style={{ background: FUSION_DARK2, padding: '32px 40px', borderTop: '1px solid rgba(232,230,220,.05)',
      borderBottom: '1px solid rgba(232,230,220,.05)', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ fontSize: 10, letterSpacing: 2, textTransform: 'uppercase', color: 'rgba(232,230,220,.45)',
          fontFamily: '"IBM Plex Mono", monospace', marginBottom: 14 }}>{label}</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '12px 28px' }}>
          {items.map((x, i) =>
            <span key={i} style={{ fontSize: 15, color: 'rgba(232,230,220,.82)', fontWeight: 500, display: 'flex', alignItems: 'center', gap: 10 }}>
              {x}
              {i < items.length - 1 && <span style={{ color: 'rgba(232,230,220,.2)' }}>·</span>}
            </span>)}
        </div>
      </div>
    </section>);
}

// ─── HOME · SECTION CARDS (links to inner pages) ────────────
function SectionLinks({ lang }) {
  const t = lang === 'en' ? {
    eyebrow: 'The site',
    h: 'Four ways into our work',
    sub: 'Each section is its own page — open the one that matters to you.',
    cards: [
      { tag: '01 / Services', title: 'What we do', desc: 'Seven service lines around territorial planning, environmental assessment and public investment.', cta: 'View services', href: 'servicios.html' },
      { tag: '02 / Track record', title: 'Where we are working', desc: 'Active proposals across Tolima and Huila, plus national engagement with the Ministry of Environment.', cta: 'View timeline', href: 'trayectoria.html' },
      { tag: '03 / About', title: 'A specialized firm with senior leadership', desc: 'Partner-led delivery articulated with a curated network of specialized associates — 16+ years of consulting practice behind every engagement.', cta: 'About the firm', href: 'nosotros.html' },
      { tag: '04 / Contact', title: 'Build the project together', desc: 'Writing a call, evaluating an instrument, or just exploring options? Reach out.', cta: 'Get in touch', href: 'contacto.html' }
    ]
  } : {
    eyebrow: 'El sitio',
    h: 'Cuatro entradas a nuestro trabajo',
    sub: 'Cada sección es su propia página — entra a la que te interesa.',
    cards: [
      { tag: '01 / Servicios', title: 'Lo que hacemos', desc: 'Siete líneas de servicio sobre ordenamiento territorial, evaluación ambiental e inversión pública.', cta: 'Ver servicios', href: 'servicios.html' },
      { tag: '02 / Trayectoria', title: 'Dónde estamos trabajando', desc: 'Propuestas activas en Tolima y Huila, más gestión nacional con el Ministerio de Ambiente.', cta: 'Ver línea de tiempo', href: 'trayectoria.html' },
      { tag: '03 / Nosotros', title: 'Una firma especializada con dirección senior', desc: 'Dirección del socio fundador articulada con una red curada de aliados especializados — 16+ años de práctica consultiva respaldando cada proyecto.', cta: 'Conocer la firma', href: 'nosotros.html' },
      { tag: '04 / Contacto', title: 'Construyamos el proyecto', desc: '¿Estás armando una convocatoria, evaluando un instrumento o explorando opciones? Escríbenos.', cta: 'Hablemos', href: 'contacto.html' }
    ]
  };
  return (
    <section style={{ background: FUSION_BG, padding: '110px 40px', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 60, marginBottom: 60, alignItems: 'end' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: 3, textTransform: 'uppercase', color: FUSION_ACCENT,
              fontFamily: '"IBM Plex Mono", monospace', marginBottom: 18 }}>◦ {t.eyebrow}</div>
            <h2 style={{ fontSize: 52, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -1.5, margin: 0, lineHeight: 1.05 }}>{t.h}</h2>
          </div>
          <p style={{ fontSize: 17, color: '#2C4A54', lineHeight: 1.55, margin: 0, maxWidth: 560 }}>{t.sub}</p>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 24 }}>
          {t.cards.map((c, i) => (
            <a key={i} href={c.href} className="section-card" style={{
              background: '#fff', padding: '40px 36px 36px', borderRadius: 4, textDecoration: 'none', color: 'inherit',
              display: 'block', position: 'relative', overflow: 'hidden',
              border: '1px solid rgba(11,61,79,.08)', transition: 'transform .18s, box-shadow .18s',
              minHeight: 280
            }}>
              <div style={{ fontSize: 11, fontFamily: '"IBM Plex Mono", monospace', letterSpacing: 1.5,
                color: FUSION_ACCENT, textTransform: 'uppercase', marginBottom: 24 }}>
                {c.tag}
              </div>
              <div style={{ fontSize: 30, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -0.8, lineHeight: 1.15 }}>
                {c.title}
              </div>
              <div style={{ fontSize: 15, color: '#2C4A54', opacity: 0.78, lineHeight: 1.55, marginTop: 14, maxWidth: 420 }}>
                {c.desc}
              </div>
              <div style={{ position: 'absolute', bottom: 32, left: 36, fontSize: 13, fontWeight: 600,
                color: FUSION_ACCENT, display: 'flex', alignItems: 'center', gap: 8 }}>
                {c.cta} <span style={{ display: 'inline-block', transition: 'transform .18s' }}>→</span>
              </div>
            </a>
          ))}
        </div>
      </div>
      <style>{`
        .section-card:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -20px rgba(11,61,79,.18); opacity: 1 !important; }
        .section-card:hover span { transform: translateX(4px); }
      `}</style>
    </section>);
}

// ─── HOME · SERVICES PREVIEW (compact list, links to /servicios) ──
function ServiciosPreview({ lang }) {
  const t = lang === 'en' ?
    { eyebrow: 'Services', h: 'What we do', cta: 'See all 7 services', sub: 'Seven service lines built around a single objective: turning territorial knowledge into well-formulated public investment.' } :
    { eyebrow: 'Servicios', h: 'Lo que hacemos', cta: 'Ver los 7 servicios', sub: 'Siete líneas de servicio alrededor de un mismo objetivo: convertir el conocimiento territorial en inversión pública bien formulada.' };
  return (
    <section style={{ background: '#fff', padding: '110px 40px', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.4fr', gap: 80, alignItems: 'start' }}>
          <div style={{ position: 'sticky', top: 100 }}>
            <div style={{ fontSize: 11, letterSpacing: 3, textTransform: 'uppercase', color: FUSION_ACCENT,
              fontFamily: '"IBM Plex Mono", monospace', marginBottom: 18 }}>◦ {t.eyebrow}</div>
            <h2 style={{ fontSize: 52, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -1.5, margin: 0, lineHeight: 1.05 }}>{t.h}</h2>
            <p style={{ fontSize: 16, color: '#2C4A54', lineHeight: 1.55, marginTop: 22, maxWidth: 380 }}>{t.sub}</p>
            <a href="servicios.html" style={{ marginTop: 28, display: 'inline-flex', alignItems: 'center', gap: 8,
              background: FUSION_PRIMARY, color: '#fff', padding: '12px 18px', fontSize: 13, fontWeight: 600,
              textDecoration: 'none', borderRadius: 2 }}>
              {t.cta} →
            </a>
          </div>
          <div>
            {SERVICIOS.map((s, i) => (
              <a key={s.num} href="servicios.html" style={{
                display: 'grid', gridTemplateColumns: '60px 1fr 30px', gap: 20, alignItems: 'center',
                padding: '22px 0', borderTop: i === 0 ? '1px solid rgba(11,61,79,.15)' : 'none',
                borderBottom: '1px solid rgba(11,61,79,.15)',
                color: 'inherit', textDecoration: 'none', transition: 'background .15s'
              }}
              onMouseEnter={(e)=>{e.currentTarget.style.background='rgba(196,122,61,.05)';}}
              onMouseLeave={(e)=>{e.currentTarget.style.background='transparent';}}>
                <div style={{ fontSize: 13, color: FUSION_ACCENT, fontFamily: '"IBM Plex Mono", monospace', letterSpacing: 1, fontWeight: 500 }}>
                  {s.num}
                </div>
                <div style={{ fontSize: 19, fontWeight: 700, color: FUSION_PRIMARY, letterSpacing: -0.3 }}>
                  {lang === 'en' ? s.titulo_en : s.titulo}
                </div>
                <div style={{ fontSize: 18, color: FUSION_ACCENT, justifySelf: 'end' }}>→</div>
              </a>
            ))}
          </div>
        </div>
      </div>
    </section>);
}

// ─── HOME · STATS (linking to trayectoria) ──────────────────
function StatsBand({ lang }) {
  const t = lang === 'en' ? {
    h: 'A young firm, moving',
    sub: 'OTS was founded in March 2024. Here is a snapshot of where we are today.',
    cta: 'Full track record',
    s: [
      { n: '5', l: 'Municipalities engaged' },
      { n: '2', l: 'National calls (MinAmbiente)' },
      { n: '7', l: 'Service lines' },
      { n: '24', l: 'Months operating' }
    ]
  } : {
    h: 'Una firma joven, en movimiento',
    sub: 'OTS se fundó en marzo de 2024. Esta es una foto de dónde estamos hoy.',
    cta: 'Trayectoria completa',
    s: [
      { n: '5', l: 'Municipios con propuesta' },
      { n: '2', l: 'Convocatorias nacionales (MinAmbiente)' },
      { n: '7', l: 'Líneas de servicio' },
      { n: '24', l: 'Meses operando' }
    ]
  };
  return (
    <section style={{ background: FUSION_DARK, color: FUSION_INK_LIGHT, padding: '100px 40px', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 60, alignItems: 'end', marginBottom: 56 }}>
          <h2 style={{ fontSize: 48, fontWeight: 800, letterSpacing: -1.5, margin: 0, lineHeight: 1.08 }}>{t.h}</h2>
          <div>
            <p style={{ fontSize: 16, color: 'rgba(232,230,220,.72)', lineHeight: 1.55, margin: 0, marginBottom: 18 }}>{t.sub}</p>
            <a href="trayectoria.html" style={{ fontSize: 13, fontWeight: 600, color: FUSION_ACCENT, textDecoration: 'none',
              borderBottom: `1px solid ${FUSION_ACCENT}`, paddingBottom: 2 }}>
              {t.cta} →
            </a>
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1, background: 'rgba(232,230,220,.1)' }}>
          {t.s.map((x, i) => (
            <div key={i} style={{ background: FUSION_DARK, padding: '38px 24px 32px' }}>
              <div style={{ fontSize: 64, fontWeight: 800, color: FUSION_ACCENT, letterSpacing: -2, lineHeight: 1 }}>{x.n}</div>
              <div style={{ fontSize: 12, color: 'rgba(232,230,220,.65)', marginTop: 14, letterSpacing: 1.2,
                textTransform: 'uppercase', fontFamily: '"IBM Plex Mono", monospace', lineHeight: 1.4 }}>
                {x.l}
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>);
}

// ─── HOME · CONTACT CTA STRIP ───────────────────────────────
function ContactStrip({ lang }) {
  const t = lang === 'en' ?
    { h: 'Build the project together.', sub: "Writing a call, evaluating an instrument, or just exploring options? We reply within 48 hours.", cta: 'Get in touch' } :
    { h: 'Construyamos el proyecto juntos.', sub: '¿Estás armando una convocatoria, evaluando un instrumento o explorando opciones? Respondemos en menos de 48 horas.', cta: 'Hablemos' };
  return (
    <section style={{ background: FUSION_BG, padding: '90px 40px', fontFamily: '"Archivo", sans-serif' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 60, alignItems: 'center' }}>
        <div>
          <h2 style={{ fontSize: 48, fontWeight: 800, color: FUSION_PRIMARY, letterSpacing: -1.5, margin: 0, lineHeight: 1.05 }}>
            {t.h}
          </h2>
          <p style={{ fontSize: 16, color: '#2C4A54', lineHeight: 1.55, marginTop: 18, maxWidth: 540 }}>{t.sub}</p>
        </div>
        <div style={{ justifySelf: 'end' }}>
          <a href="contacto.html" style={{ background: FUSION_PRIMARY, color: '#fff', padding: '18px 28px',
            fontSize: 15, fontWeight: 600, textDecoration: 'none', borderRadius: 2, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            {t.cta} →
          </a>
        </div>
      </div>
    </section>);
}

// ─── APP ─────────────────────────────────────────────────────
function App() {
  const [lang, setLang] = useLang();
  return (
    <React.Fragment>
      <Header lang={lang} setLang={setLang} current="home" />
      <HomeHero lang={lang} />
      <Marquee lang={lang} />
      <SectionLinks lang={lang} />
      <ServiciosPreview lang={lang} />
      <StatsBand lang={lang} />
      <ContactStrip lang={lang} />
      <Footer lang={lang} />
    </React.Fragment>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
